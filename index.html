<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mates de 4rt</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
<h1>Mates de 4rt</h1>
<p>Tria un mode de joc</p>
</header>

<main>
<section id="menu">
<button class="mode" data-mode="operacions">➗ Operacions</button>
<button class="mode" data-mode="grafiques">🎨 Fraccions gràfiques</button>
<button class="mode" data-mode="problemes">🍰 Problemes de comprensió</button>
<button id="obrir-album">📖 Àlbum de cromos</button>
</section>

<section id="album" class="ocult">
<button id="tornar-album">← Tornar</button>
<h2>Àlbum de cromos</h2>
<p>Guanya exercicis per desbloquejar cromos. Els cromos pendents mostren la caràtula de la seva categoria i el seu número.</p>
<div id="coleccio-cromos"></div>

<div class="administracio-cromos" style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #e5e7eb;">
<h4>Administració de cromos</h4>
<div style="display: grid; gap: 0.5rem; margin-bottom: 0.75rem;">
<input type="password" id="contrasenya-cromos" placeholder="Contrasenya" autocomplete="off">
<input type="number" id="numero-cromo" min="1" max="250" placeholder="Número de cromo (1-250)">
</div>
<div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
<button type="button" id="desbloqueja-cromo">Desbloqueja</button>
<button type="button" id="bloqueja-cromo">Bloqueja</button>
</div>
<p id="missatge-cromos"></p>
</div>
</section>

<section id="joc" class="ocult">
<button id="tornar">← Tornar</button>
<h2 id="titol-mode"></h2>
<div class="opcions">
<label>Dificultat
<select id="dificultat">
<option value="facil">Fàcil</option>
<option value="mitja">Mitjana</option>
<option value="dificil">Difícil</option>
</select>
</label>
<button id="nou">Nou exercici</button>
</div>
<div id="exercici"></div>
<p id="missatge"></p>
</section>
</main>

<footer class="credits">Imatges dels cromos generades amb Perplexity.</footer>

<script src="js/fraccions.js"></script>
<script src="js/fraccions-grafiques.js"></script>
<script src="js/problemes-comprensio.js"></script>
<script src="js/cromos-animals.js"></script>
<script src="js/cromos.js"></script>
<script src="js/app.js"></script>
</body>
</html>
